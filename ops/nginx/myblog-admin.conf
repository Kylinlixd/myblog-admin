# Vite 资源必须只从当前发布目录读取；缺失的旧 hash 不能回退到 index.html。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

# 安全响应头由 /etc/nginx/snippets/security-headers.conf 统一提供：
# sites-enabled 在 server 级 include 一次，并在 = /index.html、pdf 等
# 自带 add_header 的 location 里重复 include（nginx 继承规则）。
# 本 snippet 不再重复顶层头，避免 server 级出现两套值。

# SEO 三件套由 Django 提供（blog/seo_views.py），不能落进 SPA 的 index.html 兜底
location = /robots.txt {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

location = /feed.xml {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

location = /assets/pdf.worker.mjs {
    try_files $uri =404;
    default_type application/javascript;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 代码块「试运行 / HTML 预览」的运行页：文章示例代码需要执行，只对这
# 一个路径放宽 CSP（站点主 CSP 保持严格）。页面自身拒绝顶层打开，且
# 必须被 sandbox iframe（opaque origin）嵌入，读不到站点 Cookie 与存储。
location = /blog-code-runner.html {
    try_files $uri =404;
    add_header Content-Security-Policy "default-src *; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; font-src * data:; frame-src *; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# 御器工具页（random-lex 词条抽取器）：纯静态 HTML/CSS/JS，使用 localStorage、
# Web Speech API、Web Audio API，可选 fetch 维基百科 REST API 与 CDN 加载 SheetJS
# 解析 Excel。CSP 仅放开所需来源，frame-ancestors 'self' 限制只能被本站 iframe 嵌入。
# 御器通用工具位：新增工具放 /tools/<slug>/ 即自动生效。
# CSP 按全部工具的最大集放宽（jsdelivr=js-yaml/markdown-it，sheetjs=表格转换），
# /tools/random-lex/ 有更具体的 location（含维基百科），nginx 最长前缀优先不受影响。
location ^~ /tools/ {
    try_files $uri =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; frame-src 'self' https://cdn.sheetjs.com; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 媒体转换：ffmpeg.wasm 需从 unpkg 拉 core（~25MB）并以 blob: 启动 worker，
# 单线程核心无需 COOP/COEP，但不能与通用工具 CSP 混用，单独放宽。
location ^~ /tools/media-convert/ {
    try_files $uri =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com blob:; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /tools/random-lex/ {
    try_files $uri =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://en.wikipedia.org; frame-src 'self' https://cdn.sheetjs.com; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    # 本 location 自带 add_header，会关闭 server 级头的继承，需自行重复
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 入口 HTML 不缓存：部署后浏览器每次都能拿到引用新 hash 资源的 index.html。
# （hash 资源本身 immutable 长缓存，二者配合才不会出现「部署后客户端还跑旧版本」）
location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

# 构建版本标识：客户端版本检测（App 内发现新版本提示刷新）依赖它始终取到最新值
location = /version.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    access_log off;
}

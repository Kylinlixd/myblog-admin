name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
        
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Package release
        run: |
          mkdir -p .release-package
          cp -R dist/. .release-package/
          cp ops/nginx/myblog-admin.conf .release-package/.myblog-admin-assets.conf
          tar -czf release.tgz -C .release-package .
          
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release.tgz"
          target: "/tmp"
          
      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            release_id="${{ github.sha }}"
            release_dir="/var/www/myblog-admin/releases/${release_id}"
            mkdir -p "$release_dir"
            tar -xzf "/tmp/release.tgz" -C "$release_dir"
            ln -sfn "$release_dir" /var/www/myblog-admin/current
            install -d /etc/nginx/snippets
            install -m 0644 "$release_dir/.myblog-admin-assets.conf" /etc/nginx/snippets/myblog-admin-assets.conf
            if ! grep -qF 'include /etc/nginx/snippets/myblog-admin-assets.conf;' /etc/nginx/sites-enabled/myblog-admin; then
              sed -i '/    location \/ {/i\    include /etc/nginx/snippets/myblog-admin-assets.conf;' /etc/nginx/sites-enabled/myblog-admin
            fi
            rm -f /tmp/release.tgz
            nginx -t
            systemctl reload nginx

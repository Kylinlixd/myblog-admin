<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto;max-width:100%;">
  <title id="title">后端幂等与事务边界</title>
  <desc id="desc">展示支付或订单写入时，幂等键、数据库事务和异步副作用的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6eee3"/><stop offset="1" stop-color="#e9dccb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#57402e" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#bb6438"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="110" y="108" fill="#182538" font-size="48" font-family="Arial, sans-serif" font-weight="700">写操作的安全边界</text>
  <text x="112" y="154" fill="#6c6b68" font-size="24" font-family="Arial, sans-serif">Idempotency + Transaction · 同一个请求只产生一次结果</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="120" y="260" width="350" height="330" rx="26" fill="#fffaf2"/>
    <text x="295" y="322" text-anchor="middle" fill="#182538" font-size="28" font-weight="700">1 · 幂等入口</text>
    <text x="295" y="380" text-anchor="middle" fill="#bb6438" font-size="24">Idempotency-Key</text>
    <text x="295" y="430" text-anchor="middle" fill="#566274" font-size="20">先查重复请求</text>
    <text x="295" y="470" text-anchor="middle" fill="#566274" font-size="20">重复则返回原结果</text>
    <text x="295" y="526" text-anchor="middle" fill="#8a7d70" font-size="18">唯一索引兜底</text>
    <rect x="625" y="260" width="350" height="330" rx="26" fill="#fffaf2"/>
    <text x="800" y="322" text-anchor="middle" fill="#182538" font-size="28" font-weight="700">2 · 数据事务</text>
    <text x="800" y="380" text-anchor="middle" fill="#2f7f78" font-size="24">BEGIN</text>
    <text x="800" y="430" text-anchor="middle" fill="#566274" font-size="20">写主记录 + 状态</text>
    <text x="800" y="470" text-anchor="middle" fill="#566274" font-size="20">全部成功才 COMMIT</text>
    <text x="800" y="526" text-anchor="middle" fill="#8a7d70" font-size="18">异常自动 ROLLBACK</text>
    <rect x="1130" y="260" width="350" height="330" rx="26" fill="#fffaf2"/>
    <text x="1305" y="322" text-anchor="middle" fill="#182538" font-size="28" font-weight="700">3 · 异步副作用</text>
    <text x="1305" y="380" text-anchor="middle" fill="#bb6438" font-size="24">Outbox / Queue</text>
    <text x="1305" y="430" text-anchor="middle" fill="#566274" font-size="20">提交后再发通知</text>
    <text x="1305" y="470" text-anchor="middle" fill="#566274" font-size="20">失败可重放</text>
    <text x="1305" y="526" text-anchor="middle" fill="#8a7d70" font-size="18">不把网络调用塞进事务</text>
  </g>
  <path d="M470 425 H615" stroke="#bb6438" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M975 425 H1120" stroke="#bb6438" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="170" y="690" width="1260" height="86" rx="18" fill="#182538"/>
  <text x="800" y="744" fill="#fffaf2" font-size="25" text-anchor="middle" font-family="Arial, sans-serif">幂等解决“重复”，事务解决“半成品”，Outbox 解决“提交后还要做什么”。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto;max-width:100%;">
  <title id="title">后端请求失败恢复流程</title>
  <desc id="desc">展示一次后端请求从入口到幂等、超时、重试和降级的排查路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101a31"/><stop offset="1" stop-color="#1d3153"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#07101f" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#e39a68"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="100" r="260" fill="#68c6bc" opacity=".08"/>
  <text x="110" y="108" fill="#f8efe4" font-size="48" font-family="Arial, sans-serif" font-weight="700">一次请求失败，如何不靠猜</text>
  <text x="112" y="154" fill="#b9c6d8" font-size="24" font-family="Arial, sans-serif">Request Recovery Map · 入口、证据、边界、恢复</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="100" y="280" width="230" height="150" rx="22" fill="#f8efe4"/>
    <text x="215" y="335" text-anchor="middle" fill="#172436" font-size="25" font-weight="700">API 入口</text>
    <text x="215" y="375" text-anchor="middle" fill="#536174" font-size="20">request_id</text>
    <text x="215" y="406" text-anchor="middle" fill="#536174" font-size="20">trace_id</text>
    <rect x="430" y="280" width="230" height="150" rx="22" fill="#f8efe4"/>
    <text x="545" y="335" text-anchor="middle" fill="#172436" font-size="25" font-weight="700">先查证据</text>
    <text x="545" y="375" text-anchor="middle" fill="#536174" font-size="20">日志 / 指标</text>
    <text x="545" y="406" text-anchor="middle" fill="#536174" font-size="20">依赖耗时</text>
    <rect x="760" y="280" width="230" height="150" rx="22" fill="#f8efe4"/>
    <text x="875" y="335" text-anchor="middle" fill="#172436" font-size="25" font-weight="700">判断边界</text>
    <text x="875" y="375" text-anchor="middle" fill="#536174" font-size="20">可重试？</text>
    <text x="875" y="406" text-anchor="middle" fill="#536174" font-size="20">是否幂等？</text>
    <rect x="1090" y="280" width="350" height="150" rx="22" fill="#d98756"/>
    <text x="1265" y="335" text-anchor="middle" fill="#fff9f1" font-size="25" font-weight="700">恢复策略</text>
    <text x="1265" y="375" text-anchor="middle" fill="#fff2e6" font-size="20">退避重试 · 降级 · 告警</text>
    <text x="1265" y="406" text-anchor="middle" fill="#fff2e6" font-size="20">让失败可控</text>
  </g>
  <path d="M330 355 H420" stroke="#e39a68" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M660 355 H750" stroke="#e39a68" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M990 355 H1080" stroke="#e39a68" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M875 450 V595 H1265 V450" fill="none" stroke="#68c6bc" stroke-width="5" stroke-dasharray="14 14" marker-end="url(#arrow)"/>
  <text x="875" y="548" fill="#9de1d5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif">失败也要返回确定的状态</text>
  <rect x="100" y="700" width="1340" height="92" rx="18" fill="#0b1427" stroke="#36506f"/>
  <text x="770" y="758" fill="#f8efe4" font-size="24" text-anchor="middle" font-family="Arial, sans-serif">核心原则：先建立请求级证据，再决定恢复动作；不要用无限重试掩盖根因。</text>
</svg>

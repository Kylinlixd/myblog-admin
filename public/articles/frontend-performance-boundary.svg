<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto;max-width:100%;">
  <title id="title">前端性能排查边界</title>
  <desc id="desc">把前端性能问题拆成网络、脚本、渲染和交互四个阶段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbf6ed"/><stop offset="1" stop-color="#ece2d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5c4938" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="110" y="108" fill="#182538" font-size="48" font-family="Arial, sans-serif" font-weight="700">性能问题，先定位在哪一段</text>
  <text x="112" y="154" fill="#6c6b68" font-size="24" font-family="Arial, sans-serif">Performance Boundary · 不要一上来就“全站优化”</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="110" y="300" width="300" height="220" rx="24" fill="#182538"/>
    <text x="260" y="365" text-anchor="middle" fill="#f8efe4" font-size="29" font-weight="700">网络 Network</text>
    <text x="260" y="420" text-anchor="middle" fill="#b9c6d8" font-size="20">TTFB / 资源体积</text>
    <text x="260" y="458" text-anchor="middle" fill="#b9c6d8" font-size="20">缓存 / CDN / 接口</text>
    <rect x="480" y="300" width="300" height="220" rx="24" fill="#fffaf2"/>
    <text x="630" y="365" text-anchor="middle" fill="#182538" font-size="29" font-weight="700">脚本 Script</text>
    <text x="630" y="420" text-anchor="middle" fill="#6c6b68" font-size="20">包大小 / 执行耗时</text>
    <text x="630" y="458" text-anchor="middle" fill="#6c6b68" font-size="20">拆包 / 懒加载</text>
    <rect x="850" y="300" width="300" height="220" rx="24" fill="#fffaf2"/>
    <text x="1000" y="365" text-anchor="middle" fill="#182538" font-size="29" font-weight="700">渲染 Render</text>
    <text x="1000" y="420" text-anchor="middle" fill="#6c6b68" font-size="20">布局 / 绘制 / 列表</text>
    <text x="1000" y="458" text-anchor="middle" fill="#6c6b68" font-size="20">虚拟滚动 / 骨架屏</text>
    <rect x="1220" y="300" width="300" height="220" rx="24" fill="#d98756"/>
    <text x="1370" y="365" text-anchor="middle" fill="#fffaf2" font-size="29" font-weight="700">交互 Interaction</text>
    <text x="1370" y="420" text-anchor="middle" fill="#fff2e6" font-size="20">输入延迟 / 竞态</text>
    <text x="1370" y="458" text-anchor="middle" fill="#fff2e6" font-size="20">防抖 / 取消过期请求</text>
  </g>
  <path d="M110 620 H1520" stroke="#bb6438" stroke-width="8"/>
  <circle cx="260" cy="620" r="15" fill="#bb6438"/><circle cx="630" cy="620" r="15" fill="#bb6438"/><circle cx="1000" cy="620" r="15" fill="#bb6438"/><circle cx="1370" cy="620" r="15" fill="#bb6438"/>
  <text x="800" y="730" fill="#182538" font-size="25" text-anchor="middle" font-family="Arial, sans-serif">先用 Performance、Network、Coverage 和真实设备数据确认瓶颈，再做有边界的优化。</text>
</svg>

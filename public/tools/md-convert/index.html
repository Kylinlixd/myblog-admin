<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>md-convert · Markdown 转换器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a7180'/%3E%3Ctext x='50' y='60' font-size='26' text-anchor='middle' fill='%23fffaf2' font-family='monospace'&gt;M↓%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.0/dist/html-docx.js"></script>
<style>
:root{--bg:#f5efe5;--paper:#fffdf8;--line:#e9e3d8;--ink:#17263d;--muted:#7a746a;--accent:#c86f37;--accent-strong:#a64e23;--ok:#3f7a52;--radius:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#171410;--paper:#211d17;--line:#3a332a;--ink:#ece4d6;--muted:#9a9184;--accent:#d98b4f;--accent-strong:#e0a06a;--ok:#6fae86}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.back-link{color:var(--muted);text-decoration:none;font-size:13px}
.back-link:hover{color:var(--accent)}
.brand{font-weight:800}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:650}
button.primary{background:var(--accent);border-color:var(--accent);color:#fffaf2}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:420px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.7 var(--mono);resize:vertical;box-sizing:border-box}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.preview{min-height:420px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto;max-height:640px}
.preview h1,.preview h2,.preview h3{border-bottom:1px solid var(--line);padding-bottom:6px}
.preview code{background:rgba(42,113,128,.1);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:.9em}
.preview pre{background:#1e293b;color:#e2e8f0;border-radius:8px;padding:14px;overflow:auto;font:13px/1.6 var(--mono)}
.preview blockquote{margin:0;padding:8px 14px;border-left:3px solid var(--accent);background:rgba(200,111,55,.06);color:var(--muted)}
.preview table{border-collapse:collapse}
.preview th,.preview td{border:1px solid var(--line);padding:6px 10px}
.preview img{max-width:100%}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.err{color:#b14f3f;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-link" href="/blog/tools" target="_top">← 返回御器</a>
    <div class="brand">md-convert<small>Markdown → HTML / Word / PDF 打印</small></div>
  </header>

  <div class="row">
    <button class="primary" id="convertBtn">渲染预览</button>
    <button id="htmlBtn" disabled>下载 HTML</button>
    <button id="docxBtn" disabled>导出 Word (.docx)</button>
    <button id="pdfBtn" disabled>打印 / 存为 PDF</button>
    <button id="copyBtn" disabled>复制 HTML</button>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Markdown 输入</h3>
      <textarea id="input" spellcheck="false"># 时不语之间

> 拖入 `.md` 文件或直接粘贴。

## 特性列表

- **实时渲染**（markdown-it，与博客正文同款渲染器家族）
- 导出 **HTML** / **Word** / **打印为 PDF**
- 表格、代码块、引用全部支持

| 功能 | 状态 |
| --- | --- |
| 本地处理 | ✅ |
| 零上传 | ✅ |

\`\`\`js
console.log('hello md-convert')
\`\`\`
</textarea>
      <p class="err" id="err" hidden></p>
      <p class="hint">支持拖拽 .md / .markdown 文件到输入框直接载入。</p>
    </div>
    <div class="card">
      <h3>预览</h3>
      <div class="preview" id="preview">渲染后在这里预览。</div>
    </div>
  </div>
</div>

<script>
'use strict'
const $ = id => document.getElementById(id)
const md = window.markdownit({ html: true, linkify: true, typographer: true })
let lastHtml = ''

function render() {
  try {
    lastHtml = md.render($('input').value)
    $('preview').innerHTML = lastHtml
    ;['htmlBtn', 'docxBtn', 'pdfBtn', 'copyBtn'].forEach(id => $(id).disabled = !lastHtml)
    $('err').hidden = true
  } catch (error) {
    $('err').hidden = false
    $('err').textContent = '✗ ' + error.message
  }
}

$('input').addEventListener('input', render)
$('input').addEventListener('input', () => {}, { once: true })

// 拖入 .md 文件直接载入
const input = $('input')
;['dragover', 'dragenter'].forEach(ev => input.addEventListener(ev, e => e.preventDefault()))
input.addEventListener('drop', e => {
  e.preventDefault()
  const file = e.dataTransfer.files[0]
  if (!file || !/\.(md|markdown|txt)$/i.test(file.name)) return
  file.text().then(text => { input.value = text; render() })
})

function styledHtml() {
  // Word 导出与打印都需要内联基础样式：保持与预览一致的可读性
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    body{font:15px/1.8 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17263d;max-width:760px;margin:0 auto;padding:32px}
    h1,h2,h3,h4{border-bottom:1px solid #e9e3d8;padding-bottom:6px;line-height:1.4}
    code{background:rgba(42,113,128,.1);border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
    pre{background:#1e293b;color:#e2e8f0;border-radius:8px;padding:14px;overflow:auto}
    pre code{background:none;color:inherit;padding:0}
    blockquote{margin:0;padding:8px 14px;border-left:3px solid #c86f37;background:rgba(200,111,55,.06);color:#5d554e}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #d9dfe9;padding:6px 10px}
    th{background:#1e293b;color:#f8fafc}
    img{max-width:100%}
  </style></head><body>${lastHtml}</body></html>`
}

function download(blob, filename) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = filename
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 3000)
}

const baseName = () => (lastHtml.match(/<h[12][^>]*>([^<]+)/) || [])[1]?.trim() || 'document'

$('convertBtn').addEventListener('click', render)
$('htmlBtn').addEventListener('click', () => {
  download(new Blob([styledHtml()], { type: 'text/html' }), `${baseName()}.html`)
})
$('docxBtn').addEventListener('click', () => {
  // html-docx-js 把带样式的 HTML 包装为 Word 可打开的 doc 容器
  const converted = window.htmlDocx.asBlob(styledHtml(), { orientation: 'portrait', margins: { top: 1134, bottom: 1134, left: 1134, right: 1134 } })
  download(converted, `${baseName()}.docx`)
})
$('pdfBtn').addEventListener('click', () => {
  // 打印管线：浏览器原生「另存为 PDF」，保留分页语义
  const win = window.open('', '_blank')
  if (!win) { alert('弹窗被拦截，请允许后重试'); return }
  win.document.write(styledHtml())
  win.document.close()
  win.addEventListener('load', () => win.print())
})
$('copyBtn').addEventListener('click', async () => {
  await navigator.clipboard.writeText(lastHtml)
  $('copyBtn').textContent = '已复制'
  setTimeout(() => $('copyBtn').textContent = '复制 HTML', 1200)
})

render()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>regex-lab · 正则调试器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a7180'/%3E%3Ctext x='50' y='66' font-size='40' text-anchor='middle' fill='%23fffaf2' font-family='monospace'&gt;.*%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5efe5;--paper:#fffdf8;--line:#e9e3d8;--ink:#17263d;--muted:#7a746a;--accent:#c86f37;--accent-strong:#a64e23;--ok:#3f7a52;--radius:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--mark:#f7e2cf;--mark-ink:#a44e25}
@media (prefers-color-scheme:dark){:root{--bg:#171410;--paper:#211d17;--line:#3a332a;--ink:#ece4d6;--muted:#9a9184;--accent:#d98b4f;--accent-strong:#e0a06a;--ok:#6fae86;--mark:#5a3d1f;--mark-ink:#ffd9ad}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.back-link{color:var(--muted);text-decoration:none;font-size:13px}
.back-link:hover{color:var(--accent)}
.brand{font-weight:800}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.pattern-row{display:flex;gap:8px;align-items:center}
.slash{font:16px var(--mono);color:var(--muted)}
input[text], textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.6 var(--mono);box-sizing:border-box}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:160px;resize:vertical}
#pattern{flex:1;font:16px var(--mono);font-weight:650}
.flags{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-top:10px}
.flags label{display:flex;align-items:center;gap:4px;cursor:pointer}
.flags input{accent-color:var(--accent)}
.err{color:#b14f3f;font-size:13px;margin:8px 0 0;font-weight:650}
.stats{font-size:13px;color:var(--muted);margin:8px 0}
.highlight{font:14px/1.8 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.highlight mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono)}
th{color:var(--muted);font-weight:650}
.grp{color:var(--accent-strong)}
.row2{display:flex;gap:10px;align-items:center;margin:10px 0}
.row2 input{flex:1;font:14px var(--mono)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.cheats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cheats button{font:12px var(--mono);padding:4px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-link" href="/blog/tools" target="_top">← 返回御器</a>
    <div class="brand">regex-lab<small>正则调试 · 实时高亮 · 分组捕获</small></div>
  </header>

  <div class="card">
    <div class="pattern-row">
      <span class="slash">/</span>
      <input id="pattern" value="" placeholder="在此输入正则，如 (?&lt;year&gt;\d{4})-(\d{2})" spellcheck="false">
      <span class="slash">/</span>
      <span id="flagTag" class="slash" style="min-width:40px">gm</span>
    </div>
    <div class="flags">
      <label><input type="checkbox" data-flag="g" checked> g 全局</label>
      <label><input type="checkbox" data-flag="i"> i 忽略大小写</label>
      <label><input type="checkbox" data-flag="m"> m 多行</label>
      <label><input type="checkbox" data-flag="s"> s 点匹配换行</label>
      <label><input type="checkbox" data-flag="u"> u Unicode</label>
    </div>
    <p class="err" id="err" hidden></p>
    <div class="cheats" id="cheats"></div>
  </div>

  <div class="card">
    <textarea id="text" placeholder="粘贴要测试的文本…" spellcheck="false"></textarea>
    <div class="stats" id="stats">0 个匹配</div>
    <div class="highlight" id="hl">输入正则与文本后，这里实时高亮匹配。</div>
  </div>

  <div class="card">
    <div class="row2">
      <input id="replacement" placeholder="替换为…（支持 $1 引用分组、$<name> 引用命名分组）" spellcheck="false">
    </div>
    <div class="highlight" id="replaced" hidden></div>
  </div>

  <div class="card" id="groupsCard" hidden>
    <table><thead><tr><th>#</th><th>匹配</th><th>位置</th><th>分组</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</div>

<script>
'use strict'
const $ = id => document.getElementById(id)
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

const CHEATS = [
  ['\\d 数字', '\\d'], ['\\w 词字符', '\\w'], ['\\s 空白', '\\s'],
  ['中文', '[\\u4e00-\\u9fff]'], ['IP 段', '\\d{1,3}(\\.\\d{1,3}){3}'],
  ['邮箱', '[\\w.+-]+@[\\w-]+\\.[\\w.]+'], ['URL', 'https?://[^\\s)]+'],
  ['十六进制', '\\b[0-9a-fA-F]+\\b']
]
CHEATS.forEach(([label, pattern]) => {
  const btn = document.createElement('button')
  btn.textContent = label
  btn.addEventListener('click', () => { $('pattern').value = pattern; run() })
  $('cheats').append(btn)
})

function getFlags() {
  return [...document.querySelectorAll('.flags input:checked')].map(el => el.dataset.flag).join('')
}

function buildRegex() {
  const pattern = $('pattern').value
  return new RegExp(pattern, getFlags())
}

function run() {
  const err = $('err')
  err.hidden = true
  const text = $('text').value
  $('flagTag').textContent = getFlags() || '（无标志）'
  if (!$('pattern').value || !text) {
    $('stats').textContent = '0 个匹配'
    $('hl').innerHTML = esc(text)
    $('tbody').innerHTML = ''
    $('groupsCard').hidden = true
    $('replaced').hidden = true
    return
  }
  let re
  try {
    re = buildRegex()
  } catch (e) {
    err.textContent = '✗ ' + e.message
    err.hidden = false
    return
  }

  // 收集全部匹配（含命名分组）
  const matches = []
  if (re.global) {
    let m
    let guard = 0
    while ((m = re.exec(text)) !== null) {
      matches.push(m)
      if (m[0] === '') re.lastIndex++ // 零宽匹配防死循环
      if (++guard > 5000) break
    }
  } else {
    const m = re.exec(text)
    if (m) matches.push(m)
  }

  $('stats').textContent = `${matches.length} 个匹配`
  if (re.global && matches.length) $('stats').textContent += ` · lastIndex 结束于 ${matches.at(-1).index + matches.at(-1)[0].length}`

  // 高亮渲染
  const parts = []
  let cursor = 0
  for (const m of matches) {
    parts.push(esc(text.slice(cursor, m.index)))
    parts.push(`<mark>${esc(m[0]) || '∅'}</mark>`)
    cursor = m.index + m[0].length
  }
  parts.push(esc(text.slice(cursor)))
  $('hl').innerHTML = parts.join('') || '（空）'

  // 分组表
  $('tbody').innerHTML = ''
  matches.slice(0, 200).forEach((m, index) => {
    const tr = document.createElement('tr')
    const groups = m.groups
      ? Object.entries(m.groups).filter(([, v]) => v !== undefined).map(([k, v]) => `<span class="grp">${k}=${esc(v)}</span>`).join(' ')
      : m.slice(1).map((v, i) => v !== undefined ? `<span class="grp">$${i + 1}=${esc(v)}</span>` : '').filter(Boolean).join(' ')
    tr.innerHTML = `<td>${index + 1}</td><td>${esc(m[0]) || '∅'}</td><td>${m.index}–${m.index + m[0].length}</td><td>${groups || '—'}</td>`
    $('tbody').append(tr)
  })
  $('groupsCard').hidden = matches.length === 0

  // 替换预览
  const rep = $('replacement').value
  if (rep) {
    try {
      $('replaced').hidden = false
      $('replaced').innerHTML = esc(text.replace(re, rep)) || '（空）'
    } catch (e) {
      $('replaced').hidden = false
      $('replaced').textContent = '✗ ' + e.message
    }
  } else {
    $('replaced').hidden = true
  }
}

;['input', 'change'].forEach(ev => {
  $('pattern').addEventListener(ev, run)
  $('text').addEventListener(ev, run)
  $('replacement').addEventListener(ev, run)
})
document.querySelectorAll('.flags input').forEach(el => el.addEventListener('change', run))

// 预填示例，打开即可用
$('pattern').value = '(?<year>\\d{4})-(\\d{2})-(\\d{2})'
$('text').value = '博客搭建于 2023-08-15，第一篇 kali 系列发布于 2024-03-02，重构发生在 2025-11-01。'
run()
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="时不语之间的头像">
  <!-- background -->
  <rect width="240" height="240" fill="#fbf9f4"/>

  <defs>
    <linearGradient id="sweater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a2bf"/>
      <stop offset="1" stop-color="#8494b4"/>
    </linearGradient>
  </defs>

  <!-- neck -->
  <path d="M106 150 h28 v22 c0 9 -7 14 -14 14 s-14 -5 -14 -14 Z" fill="#f6dfd0"/>

  <!-- sweater -->
  <path d="M40 240 C40 198 70 178 120 178 C170 178 200 198 200 240 Z" fill="url(#sweater)"/>
  <!-- collar -->
  <path d="M102 182 C106 194 113 199 120 199 C127 199 134 194 138 182" stroke="#75849f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- sleeve seams -->
  <path d="M76 190 C70 204 67 222 67 240" stroke="#75849f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M164 190 C170 204 173 222 173 240" stroke="#75849f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ears -->
  <circle cx="66" cy="122" r="10" fill="#fbe9dc"/>
  <circle cx="174" cy="122" r="10" fill="#fbe9dc"/>

  <!-- face -->
  <ellipse cx="120" cy="118" rx="55" ry="53" fill="#fbece0"/>

  <!-- hair: fluffy top with chunky fringe -->
  <path d="M62 124
           C54 66 88 40 120 40
           C152 40 186 66 178 124
           C177 112 174 104 170 98
           C166 106 160 108 156 100
           C152 110 144 112 140 102
           C136 112 128 114 124 104
           C120 114 112 114 108 104
           C104 112 96 112 92 102
           C88 110 80 108 76 100
           C70 106 65 114 62 124 Z" fill="#4a423d"/>
  <!-- side hair pieces -->
  <path d="M63 116 C58 128 59 138 66 146 C74 142 76 130 72 118 Z" fill="#4a423d"/>
  <path d="M177 116 C182 128 181 138 174 146 C166 142 164 130 168 118 Z" fill="#4a423d"/>
  <!-- hair highlight strands -->
  <path d="M96 56 C108 50 128 50 142 57" stroke="#5c534d" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="88" cy="139" rx="10" ry="6.5" fill="#f6bcb6" opacity="0.85"/>
  <ellipse cx="152" cy="139" rx="10" ry="6.5" fill="#f6bcb6" opacity="0.85"/>

  <!-- glasses -->
  <circle cx="100" cy="120" r="17" fill="#ffffff" opacity="0.25" stroke="#3c3633" stroke-width="3.5"/>
  <circle cx="140" cy="120" r="17" fill="#ffffff" opacity="0.25" stroke="#3c3633" stroke-width="3.5"/>
  <path d="M115 116 Q120 112 125 116" stroke="#3c3633" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M83 116 L72 120" stroke="#3c3633" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M157 116 L168 120" stroke="#3c3633" stroke-width="3.5" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="100" cy="121" r="3.6" fill="#3c3633"/>
  <circle cx="140" cy="121" r="3.6" fill="#3c3633"/>

  <!-- mouth: small open smile -->
  <path d="M113 143 A7 6.5 0 0 0 127 143 Z" fill="#4a3a35"/>
</svg>
